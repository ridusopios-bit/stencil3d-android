[package]
name = "stencil3d"
version = "1.0.0"
edition = "2021"

[lib]
name = "stencil3d"
crate-type = ["cdylib", "rlib"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
earcutr = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jni = "0.21"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
