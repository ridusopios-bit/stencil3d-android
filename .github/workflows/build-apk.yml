name: Build Stencil3D Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Rust + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Install cargo-ndk
        run: |
          cargo install cargo-ndk --locked

      - name: Locate Android NDK and build Rust .so libraries
        run: |
          NDK_DIR="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-}}"
          if [ -z "$NDK_DIR" ] && [ -d "$ANDROID_HOME/ndk" ]; then
            NDK_DIR=$(ls -d "$ANDROID_HOME/ndk"/* | sort -V | tail -n 1)
          fi
          echo "Using NDK: $NDK_DIR"
          export ANDROID_NDK_HOME="$NDK_DIR"
          mkdir -p android/app/src/main/jniLibs
          cd rust
          cargo ndk -t arm64-v8a -t armeabi-v7a -o ../android/app/src/main/jniLibs build --release

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Android APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Rename and upload Stencil3D.apk
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Stencil3D.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stencil3D-APK
          path: Stencil3D.apk
